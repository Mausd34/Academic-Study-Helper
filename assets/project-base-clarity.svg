<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020817"/>
      <stop offset="0.5" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="1320" cy="170" r="230" fill="#7C3AED" fill-opacity="0.14"/>
  <circle cx="250" cy="760" r="260" fill="#22D3EE" fill-opacity="0.12"/>

  <g filter="url(#shadow)">
    <rect x="120" y="140" width="1360" height="620" rx="28" fill="rgba(15,23,42,0.78)" stroke="rgba(148,163,184,0.20)"/>
  </g>

  <text x="800" y="210" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">Academic Study Helper</text>
  <text x="800" y="260" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="500">Student productivity base for routine, attendance, tasks, learning and focus</text>

  <rect x="190" y="320" width="310" height="300" rx="26" fill="rgba(124,58,237,0.12)" stroke="rgba(167,139,250,0.50)"/>
  <rect x="555" y="320" width="310" height="300" rx="26" fill="rgba(34,211,238,0.10)" stroke="rgba(103,232,249,0.50)"/>
  <rect x="920" y="320" width="310" height="300" rx="26" fill="rgba(16,185,129,0.10)" stroke="rgba(52,211,153,0.50)"/>

  <text x="345" y="375" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Plan</text>
  <text x="710" y="375" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Track</text>
  <text x="1075" y="375" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">Improve</text>

  <g fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="21">
    <text x="235" y="435">• Class routine</text>
    <text x="235" y="470">• Attendance</text>
    <text x="235" y="505">• Task deadlines</text>
    <text x="235" y="540">• Exam calendar</text>

    <text x="600" y="435">• Notes</text>
    <text x="600" y="470">• Expense log</text>
    <text x="600" y="505">• Skills roadmap</text>
    <text x="600" y="540">• Career goals</text>

    <text x="965" y="435">• Focus timer</text>
    <text x="965" y="470">• Study analytics</text>
    <text x="965" y="505">• Performance review</text>
    <text x="965" y="540">• Better habits</text>
  </g>

  <rect x="520" y="675" width="560" height="28" rx="14" fill="url(#accent)"/>
  <text x="800" y="735" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Built for daily student clarity, structure, and academic growth.</text>
</svg>
