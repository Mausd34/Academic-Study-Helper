<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020817"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1D4ED8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <text x="800" y="70" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">How the Student Experience Works</text>

  <g filter="url(#shadow)">
    <rect x="100" y="130" width="220" height="120" rx="20" fill="url(#card)" stroke="rgba(96,165,250,0.45)"/>
    <rect x="430" y="130" width="220" height="120" rx="20" fill="url(#card)" stroke="rgba(168,85,247,0.45)"/>
    <rect x="760" y="130" width="220" height="120" rx="20" fill="url(#card)" stroke="rgba(34,197,94,0.45)"/>
    <rect x="1090" y="130" width="220" height="120" rx="20" fill="url(#card)" stroke="rgba(34,211,238,0.45)"/>
    <rect x="100" y="390" width="260" height="140" rx="20" fill="url(#card)" stroke="rgba(251,191,36,0.45)"/>
    <rect x="470" y="390" width="260" height="140" rx="20" fill="url(#card)" stroke="rgba(244,114,182,0.45)"/>
    <rect x="840" y="390" width="260" height="140" rx="20" fill="url(#card)" stroke="rgba(96,165,250,0.45)"/>
    <rect x="1210" y="390" width="250" height="140" rx="20" fill="url(#card)" stroke="rgba(16,185,129,0.45)"/>
  </g>

  <g fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif">
    <text x="210" y="185" text-anchor="middle" font-size="30" font-weight="700">Open App</text>
    <text x="540" y="185" text-anchor="middle" font-size="30" font-weight="700">Plan Classes</text>
    <text x="870" y="185" text-anchor="middle" font-size="30" font-weight="700">Track Tasks</text>
    <text x="1200" y="185" text-anchor="middle" font-size="30" font-weight="700">Study Focus</text>

    <text x="230" y="455" text-anchor="middle" font-size="27" font-weight="700">Attendance</text>
    <text x="600" y="455" text-anchor="middle" font-size="27" font-weight="700">Exams</text>
    <text x="970" y="455" text-anchor="middle" font-size="27" font-weight="700">Notes</text>
    <text x="1335" y="455" text-anchor="middle" font-size="27" font-weight="700">Results</text>
  </g>

  <g fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="18">
    <text x="170" y="220">Dashboard</text>
    <text x="500" y="220">Routine</text>
    <text x="840" y="220">Deadline view</text>
    <text x="1160" y="220">Timer + focus</text>

    <text x="165" y="490">Missed class alerts</text>
    <text x="538" y="490">Revision planning</text>
    <text x="925" y="490">Daily learning notes</text>
    <text x="1268" y="490">Progress + goals</text>
  </g>

  <path d="M320 190H430" stroke="#A78BFA" stroke-width="6" stroke-linecap="round"/>
  <path d="M650 190H760" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>
  <path d="M980 190H1090" stroke="#67E8F9" stroke-width="6" stroke-linecap="round"/>
  <path d="M230 250V390" stroke="#FBBF24" stroke-width="6" stroke-linecap="round"/>
  <path d="M540 250V390" stroke="#F472B6" stroke-width="6" stroke-linecap="round"/>
  <path d="M870 250V390" stroke="#60A5FA" stroke-width="6" stroke-linecap="round"/>
  <path d="M1200 250V390" stroke="#10B981" stroke-width="6" stroke-linecap="round"/>

  <path d="M360 440H470" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <path d="M730 440H840" stroke="#60A5FA" stroke-width="6" stroke-linecap="round"/>
  <path d="M1100 440H1210" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>

  <text x="800" y="700" text-anchor="middle" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="600">Student goal: one place to plan, study, and improve without confusion.</text>
</svg>
